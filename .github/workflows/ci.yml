name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # test-ui.js dilewati karena butuh peramban sungguhan; di jsdom ia gagal
      # sejak sebelum pekerjaan ini dimulai, dan itu cacat yang sudah dicatat.
      - run: node test.js
      - run: node test-efek.js
